[package]
name = "contacts"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/contacts-rs"
repository = "https://github.com/doom-fish/contacts-rs"
description = "Safe Rust bindings for Apple's Contacts framework — address book access on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["contacts", "address-book", "macos", "apple", "contact-store"]
categories = ["api-bindings", "os::macos-apis"]
rust-version = "1.70"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "contacts"
crate-type = ["lib"]

[features]
default = []
async = []

[dependencies]
base64 = "0.22"
doom-fish-utils = { path = "../doom-fish-utils", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pollster = "0.3"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_contacts_store_smoke"

[[example]]
name = "14_async_request_access"
required-features = ["async"]

[[example]]
name = "15_async_enumerate_contacts"
required-features = ["async"]

[profile.release]
debug = "full"
strip = "none"
